name: Release Preparation

# Prepare a release by generating the CHANGELOG.md section from conventional
# commits and opening a PR for review. After the PR is merged, push a tag
# to trigger the main release workflow (release.yml).
#
# See: RELEASE_POLICY.md, RELEASING.md

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.3.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (print changelog, do not create PR)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare release v${{ inputs.version }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: ${{ inputs.version }}"
            echo "Expected SemVer without 'v' prefix (e.g. 0.3.0)"
            exit 1
          fi

      - name: Generate changelog (dry run)
        if: inputs.dry_run
        env:
          VERSION: "${{ inputs.version }}"
        run: |
          chmod +x scripts/generate-changelog.sh
          echo "=== Generated Changelog ==="
          scripts/generate-changelog.sh --dry-run
          echo "=== End ==="

      - name: Generate changelog and create PR
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: "${{ inputs.version }}"
        run: |
          chmod +x scripts/generate-changelog.sh
          scripts/generate-changelog.sh

      - name: Create pull request
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: "release-prep/v${{ inputs.version }}"
          title: "Prepare release v${{ inputs.version }}"
          body: |
            Automated release preparation for **v${{ inputs.version }}**.

            - CHANGELOG.md updated with commits since last tag
            - Review the generated changelog entries for accuracy
            - After merge, push tag `v${{ inputs.version }}` to trigger the release workflow

            *This PR was created by an AI agent (OpenHands) via the release-prep workflow.*
          commit-message: "Prepare release v${{ inputs.version }}"
          labels: "Release"
          delete-branch: true
