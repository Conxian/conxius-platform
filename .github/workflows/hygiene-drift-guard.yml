name: Implementation Drift Guard

permissions:
  contents: read

# Implementation drift guard per Issue #968
# Validates repository hygiene alignment
# See: .github/CONXIUS_CICD_BASELINE.md

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main, develop, dev, 'release/**' ]
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main, develop, dev, 'release/**' ]
  workflow_dispatch:

jobs:
  drift-check:
    name: Implementation Alignment Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      - name: Run Drift Check
        run: |
          python3 scripts/verify_multidimensional_alignment.py

      - name: Report Failure
        if: failure()
        run: |
          echo "::error::Implementation drift detected! Service alignment verification failed."
