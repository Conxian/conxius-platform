name: Reusable Secret Scan

on:
  workflow_call:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Minimal permissions per .github/CONXIUS_CICD_BASELINE.md
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          VERSION="8.18.2"
          wget https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz
          tar -xzf gitleaks_${VERSION}_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
      - name: Run Gitleaks
        run: gitleaks detect --source . -v --redact --no-banner --config gitleaks.toml
