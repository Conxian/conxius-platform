name: Implementation Alignment Guard

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main, develop ]
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  alignment-audit:
    name: System Alignment Audit
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Run System Audit
        run: |
          python3 scripts/maintenance/system_audit.py

      - name: Report Failure
        if: failure()
        run: |
          echo "::error::Implementation drift detected! The codebase is no longer aligned with the documented Phase 6 requirements or the system audit suite."
