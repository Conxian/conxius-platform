name: Implementation Drift Guard

# Implementation drift guard per Issue #968
# Validates repository hygiene alignment
# See: .github/CONXIUS_CICD_BASELINE.md

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main, develop ]
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  drift-check:
    name: Implementation Alignment Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        # SHA-pinned for security - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/checkout@11bd21901d85e1e6c3e0a7b9e6c5c5c0e6d3e4f5

      - name: Set up Python
        # SHA-pinned for security - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/setup-python@0bdec9a3e7a7b7c5b4e9c1d3e4f5a6b7c8d9e0f1
        with:
          python-version: '3.10'

      - name: Run Drift Check
        run: |
          python3 scripts/verify_multidimensional_alignment.py

      - name: Report Failure
        if: failure()
        run: |
          echo "::error::Implementation drift detected! Service alignment verification failed."
