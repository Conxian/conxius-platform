name: Documentation Validation

permissions:
  contents: read

on:
  push:
    branches: [ main, develop, dev, 'release/**' ]
    paths:
      - '*.md'
      - '**/*.md'
      - 'openspec/**/.openspec.yaml'
      - 'scripts/check-markdown-links.mjs'
      - 'scripts/check-markdown-links.test.mjs'
      - 'package.json'
      - '.github/workflows/docs-validation.yml'
  pull_request:
    branches: [ main, develop, dev, 'release/**' ]
    paths:
      - '*.md'
      - '**/*.md'
      - 'openspec/**/.openspec.yaml'
      - 'scripts/check-markdown-links.mjs'
      - 'scripts/check-markdown-links.test.mjs'
      - 'package.json'
      - '.github/workflows/docs-validation.yml'
  workflow_dispatch:

jobs:
  markdown-links:
    name: Active Markdown links
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.15.5
          run_install: false

      - name: Test Markdown validator
        run: pnpm run test:markdown-links

      - name: Validate active Markdown links
        run: pnpm run docs:check
