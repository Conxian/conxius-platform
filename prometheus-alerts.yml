groups:
  - name: sidl-admin-dashboard-alerts
    rules:
      - alert: SIDLAdminDashboardFailureBurst
        expr: sum by (endpoint, method) (increase(admin_dashboard_sidl_failures_total[10m])) >= 5
        for: 10m
        labels:
          severity: warning
          service: admin-dashboard
          component: sidl
        annotations:
          summary: "SIDL endpoint failures are spiking"
          description: "{{ $labels.endpoint }} {{ $labels.method }} has {{ $value }} failures in the last 10 minutes."

      - alert: SIDLAdminDashboardLatencyP95High
        expr: histogram_quantile(0.95, sum by (le, endpoint, method) (rate(admin_dashboard_sidl_request_duration_seconds_bucket[10m]))) > 1
        for: 15m
        labels:
          severity: warning
          service: admin-dashboard
          component: sidl
        annotations:
          summary: "SIDL endpoint p95 latency is elevated"
          description: "{{ $labels.endpoint }} {{ $labels.method }} p95 latency is {{ $value }}s over the last 10 minutes."

      - alert: SIDLCheckoutInvalidPaymentHeaderSpike
        expr: sum(increase(admin_dashboard_sidl_checkout_payment_header_total{category="invalid"}[10m])) >= 3
        for: 10m
        labels:
          severity: critical
          service: admin-dashboard
          component: sidl-checkout
        annotations:
          summary: "Invalid SIDL checkout payment signatures increased"
          description: "Invalid payment-signature headers reached {{ $value }} in the last 10 minutes."

  - name: m2m-service-key-alerts
    rules:
      - alert: M2MActiveServiceKeyExpired
        expr: m2m_service_key_expiry_timestamp_seconds{key_role="active"} <= time()
        for: 5m
        labels:
          severity: critical
          service: admin-dashboard
          component: m2m-key-rotation
        annotations:
          summary: "Active M2M service key has expired"
          description: "The active {{ $labels.service_id }} service key generation has passed its expiry boundary."

      - alert: M2MPreviousServiceKeyExpired
        expr: m2m_service_key_expiry_timestamp_seconds{key_role="previous"} <= time()
        for: 5m
        labels:
          severity: warning
          service: admin-dashboard
          component: m2m-key-rotation
        annotations:
          summary: "Previous M2M service key grace period has ended"
          description: "The previous {{ $labels.service_id }} service key is no longer valid for grace-period authentication."

      - alert: M2MServiceKeyExpiry30d
        expr: (m2m_service_key_expiry_timestamp_seconds - time() > 7 * 24 * 60 * 60) and (m2m_service_key_expiry_timestamp_seconds - time() <= 30 * 24 * 60 * 60)
        for: 10m
        labels:
          severity: warning
          service: admin-dashboard
          component: m2m-key-rotation
        annotations:
          summary: "M2M service key expires within 30 days"
          description: "The {{ $labels.service_id }} {{ $labels.key_role }} service-key deadline is within 30 days."

      - alert: M2MServiceKeyExpiry7d
        expr: (m2m_service_key_expiry_timestamp_seconds - time() > 24 * 60 * 60) and (m2m_service_key_expiry_timestamp_seconds - time() <= 7 * 24 * 60 * 60)
        for: 10m
        labels:
          severity: warning
          service: admin-dashboard
          component: m2m-key-rotation
        annotations:
          summary: "M2M service key expires within 7 days"
          description: "The {{ $labels.service_id }} {{ $labels.key_role }} service-key deadline is within 7 days."

      - alert: M2MServiceKeyExpiry24h
        expr: (m2m_service_key_expiry_timestamp_seconds - time() > 60 * 60) and (m2m_service_key_expiry_timestamp_seconds - time() <= 24 * 60 * 60)
        for: 10m
        labels:
          severity: critical
          service: admin-dashboard
          component: m2m-key-rotation
        annotations:
          summary: "M2M service key expires within 24 hours"
          description: "The {{ $labels.service_id }} {{ $labels.key_role }} service-key deadline is within 24 hours."

      - alert: M2MServiceKeyExpiry1h
        expr: (m2m_service_key_expiry_timestamp_seconds - time() > 0) and (m2m_service_key_expiry_timestamp_seconds - time() <= 60 * 60)
        for: 5m
        labels:
          severity: critical
          service: admin-dashboard
          component: m2m-key-rotation
        annotations:
          summary: "M2M service key expires within 1 hour"
          description: "The {{ $labels.service_id }} {{ $labels.key_role }} service-key deadline is within 1 hour."

      - alert: M2MServiceKeyAuthFailureBurst
        expr: sum by (service_id) (increase(m2m_service_key_validation_total{outcome=~"invalid|expired"}[10m])) >= 5
        for: 5m
        labels:
          severity: warning
          service: admin-dashboard
          component: m2m-authentication
        annotations:
          summary: "M2M authentication failures are spiking"
          description: "{{ $labels.service_id }} recorded {{ $value }} invalid or expired service-key validations in the last 10 minutes."

      - alert: M2MServiceKeyRotationFailure
        expr: sum by (service_id) (increase(m2m_service_key_rotation_total{outcome=~"failure|conflict|rejected|unavailable"}[10m])) > 0
        for: 5m
        labels:
          severity: warning
          service: admin-dashboard
          component: m2m-key-rotation
        annotations:
          summary: "M2M service-key rotation requires operator attention"
          description: "{{ $labels.service_id }} has a rotation failure, conflict, rejection, or unavailable-registry outcome."

      - alert: M2MServiceKeyRollbackFailure
        expr: sum by (service_id) (increase(m2m_service_key_rollback_total{outcome=~"failure|conflict|rejected|unavailable"}[10m])) > 0
        for: 5m
        labels:
          severity: critical
          service: admin-dashboard
          component: m2m-key-rotation
        annotations:
          summary: "M2M service-key rollback requires operator attention"
          description: "{{ $labels.service_id }} has a rollback failure, conflict, rejection, or unavailable-registry outcome."

      - alert: M2MServiceKeyRegistryWriteFailure
        expr: sum(increase(m2m_service_key_registry_write_failures_total[10m])) > 0
        for: 5m
        labels:
          severity: critical
          service: admin-dashboard
          component: m2m-key-rotation
        annotations:
          summary: "M2M service-key registry writes are failing"
          description: "The M2M registry has recorded {{ $value }} write or recovery failures in the last 10 minutes."

      - alert: M2MServiceKeyRegistryUnavailable
        expr: (sum(increase(m2m_service_key_validation_total{outcome="unavailable"}[10m])) + sum(increase(m2m_service_key_rotation_total{outcome="unavailable"}[10m])) + sum(increase(m2m_service_key_rollback_total{outcome="unavailable"}[10m]))) > 0
        for: 5m
        labels:
          severity: critical
          service: admin-dashboard
          component: m2m-key-rotation
        annotations:
          summary: "M2M service-key registry is unavailable"
          description: "M2M validation or mutation has observed an unavailable registry; service-key operations are fail-closed."

      - alert: M2MServiceKeyRegistryNotReady
        expr: absent(m2m_service_key_registry_ready) or m2m_service_key_registry_ready == 0
        for: 10m
        labels:
          severity: critical
          service: admin-dashboard
          component: m2m-key-rotation
        annotations:
          summary: "M2M service-key registry is not ready"
          description: "The dashboard has not completed a validated M2M registry load or has latched registry recovery."

      - alert: M2MServiceKeyRegistryRevisionMissing
        expr: m2m_service_key_registry_ready == 1 unless m2m_service_key_registry_revision
        for: 10m
        labels:
          severity: critical
          service: admin-dashboard
          component: m2m-key-rotation
        annotations:
          summary: "M2M registry revision metric is missing"
          description: "Prometheus has not observed the dashboard-owned M2M registry revision metric. Check scrape authentication and registry initialization."

  - name: infrastructure-alerts
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          component: node
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
          component: node
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value }}% on {{ $labels.instance }}."

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: critical
          component: node
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk space is at {{ $value }}% on {{ $labels.instance }}."

      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL instance {{ $labels.instance }} is not reachable."

      - alert: PostgreSQLTooManyConnections
        expr: pg_stat_database_numbackends > pg_settings_max_connections * 0.8
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL connection count is high"
          description: "{{ $value }} connections on {{ $labels.instance }} (80% of max)."

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          component: cache
        annotations:
          summary: "Redis is down"
          description: "Redis instance {{ $labels.instance }} is not reachable."

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis memory at {{ $value | humanizePercentage }} on {{ $labels.instance }}."

      - alert: GatewayHighErrorRate
        expr: rate(gateway_http_errors_total[5m]) / rate(gateway_http_requests_total[5m]) > 0.05
        for: 10m
        labels:
          severity: critical
          component: gateway
        annotations:
          summary: "Gateway error rate is elevated"
          description: "Gateway error rate is {{ $value | humanizePercentage }} over 5m."

      - alert: GatewayHighLatency
        expr: histogram_quantile(0.95, rate(gateway_http_request_duration_seconds_bucket[5m])) > 2
        for: 10m
        labels:
          severity: warning
          component: gateway
        annotations:
          summary: "Gateway p95 latency is high"
          description: "Gateway p95 latency is {{ $value }}s."

      - alert: PrometheusTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
          component: monitoring
        annotations:
          summary: "Prometheus target {{ $labels.job }} is down"
          description: "Target {{ $labels.instance }} of job {{ $labels.job }} has been down for 5m."
