version: 2.1

orbs:
  node: circleci/node@5.0.0
  rust: circleci/rust@1.6.0

executors:
  docker-full:
    docker:
      - image: cimg/rust:1.72-node
    working_directory: ~/repo

commands:
  checkout-submodules:
    description: "Checkout repository and submodules"
    steps:
      - checkout
      - run:
          name: Init submodules
          command: |
            git submodule update --init --recursive

  install-pnpm:
    description: "Install pnpm"
    steps:
      - run:
          name: Install pnpm
          command: |
            corepack enable
            corepack prepare pnpm@9.15.5 --activate

jobs:
  lint-node:
    executor: docker-full
    steps:
      - checkout-submodules
      - install-pnpm
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Lint
          command: pnpm run lint

  test-node:
    executor: docker-full
    steps:
      - checkout-submodules
      - install-pnpm
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Test
          command: pnpm run test

  audit-node:
    executor: docker-full
    steps:
      - checkout-submodules
      - install-pnpm
      - run:
          name: Audit
          command: pnpm audit --audit-level moderate

  lint-rust:
    executor: docker-full
    steps:
      - checkout-submodules
      - run:
          name: Rustfmt
          command: cargo fmt -- --check
      - run:
          name: Clippy
          command: cargo clippy -- -D warnings

  test-rust:
    executor: docker-full
    steps:
      - checkout-submodules
      - run:
          name: Test
          command: cargo test --workspace --all-features

  system-audit:
    executor: docker-full
    steps:
      - checkout-submodules
      - install-pnpm
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: System Audit
          command: python3 scripts/maintenance/system_audit.py

workflows:
  version: 2
  build-test-audit:
    jobs:
      - lint-node
      - lint-rust
      - audit-node
      - test-node:
          requires:
            - lint-node
      - test-rust:
          requires:
            - lint-rust
      - system-audit:
          requires:
            - test-node
            - test-rust
