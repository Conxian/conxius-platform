name: Secret Scan

# Secret scanning per Issue #968 - CI/CD Baseline Hardening
# See: .github/CONXIUS_CICD_BASELINE.md

on:
  pull_request:
    branches: [ main, staged, dev, 'release/**' ]
  push:
    branches: [ main, staged, dev, 'release/**' ]

permissions:
  contents: read

jobs:
  gitleaks:
    uses: ./.github/workflows/reusable-secret-scan.yml
    permissions:
      contents: read
