name: Reusable CI Baseline

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '22'
      run-lint:
        required: false
        type: boolean
        default: true
      run-tests:
        required: false
        type: boolean
        default: true
      run-typecheck:
        required: false
        type: boolean
        default: true
      run-build:
        required: false
        type: boolean
        default: false
      run-e2e:
        required: false
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        if: ${{ inputs.run-lint }}
        run: |
          if jq -e '.scripts.lint' package.json > /dev/null 2>&1; then pnpm run lint; else echo "Skipping lint (no script)"; fi

      - name: Run Typecheck
        if: ${{ inputs.run-typecheck }}
        run: |
          if jq -e '.scripts.typecheck' package.json > /dev/null 2>&1; then pnpm run typecheck; else echo "Skipping typecheck (no script)"; fi

      - name: Run Tests
        if: ${{ inputs.run-tests }}
        run: |
          if jq -e '.scripts.test' package.json > /dev/null 2>&1; then pnpm test; else echo "Skipping test (no script)"; fi

      - name: Run Build
        if: ${{ inputs.run-build }}
        run: |
          if jq -e '.scripts.build' package.json > /dev/null 2>&1; then pnpm run build; else echo "Skipping build (no script)"; fi

      - name: Run E2E Tests
        if: ${{ inputs.run-e2e }}
        run: |
          if jq -e '.scripts.test:e2e' package.json > /dev/null 2>&1; then pnpm run test:e2e; else echo "Skipping e2e (no script)"; fi
