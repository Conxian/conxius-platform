name: Knowledge Base Evolution

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/kb-evolution.yml'
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force full rescan'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    name: Ingest & Analyze
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Ingest GitHub Data
        run: npx ts-node scripts/kb/ingest-github.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Pattern Detection
        run: npx ts-node scripts/kb/detect-patterns.ts

      - name: Upload Knowledge Store
        uses: actions/upload-artifact@v7
        with:
          name: knowledge-store
          path: .knowledge-store.json
          retention-days: 7

  research:
    name: External Research
    runs-on: ubuntu-24.04
    needs: ingest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download Knowledge Store
        uses: actions/download-artifact@v8
        with:
          name: knowledge-store
          path: .

      - name: Run External Research
        run: npx ts-node scripts/kb/external-research.ts
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

  synthesize:
    name: Synthesize & Update
    runs-on: ubuntu-24.04
    needs: [ingest, research]
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download Knowledge Store
        uses: actions/download-artifact@v8
        with:
          name: knowledge-store
          path: .

      - name: Generate KB Updates
        run: npx ts-node scripts/kb/generate-updates.ts

      - name: Create Update PR
        if: github.event_name == 'schedule'
        run: |
          # Check if there are significant updates
          if [ -f .kb-updates.json ]; then
            UPDATES=$(cat .kb-updates.json | jq length)
            if [ "$UPDATES" -gt 0 ]; then
              # Create branch
              BRANCH="kb-evolution/$(date +%Y%m%d)"
              git checkout -b "$BRANCH"
              
              # Stage changes
              git add .knowledge-store.json AGENTS.md 2>/dev/null || true
              
              # Check if there are actual changes
              if git diff --cached --quiet; then
                echo "No changes to commit"
              else
                # Commit
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git commit -m "chore(kb): self-evolution update $(date +%Y-%m-%d)"
                
                # Push and create PR
                git push -u origin "$BRANCH"
                gh pr create \
                  --title "chore(kb): self-evolution update $(date +%Y-%m-%d)" \
                  --body "This PR was auto-generated by the knowledge base self-evolution system. Review the changes before merging." \
                  --label "automated" \
                  --label "knowledge-base"
              fi
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  health-check:
    name: KB Health Check
    runs-on: ubuntu-24.04
    needs: ingest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Knowledge Store
        uses: actions/download-artifact@v8
        with:
          name: knowledge-store
          path: .

      - name: Run Health Check
        run: |
          echo "## Knowledge Base Health Report"
          echo ""
          
          if [ -f .knowledge-store.json ]; then
            echo "✅ Knowledge Store exists"
            
            TOTAL=$(cat .knowledge-store.json | jq '.entries | length')
            echo "- Total entries: $TOTAL"
            
            CATEGORIES=$(cat .knowledge-store.json | jq '[.entries[] | .category] | unique | join(", ")')
            echo "- Categories: $CATEGORIES"
            
            LAST_SYNC=$(cat .knowledge-store.json | jq -r '.lastSync')
            echo "- Last sync: $LAST_SYNC"
            
            AVG_CONF=$(cat .knowledge-store.json | jq '[.entries[] | .confidence] | add / length')
            echo "- Avg confidence: $(echo "$AVG_CONF * 100" | bc | cut -d. -f1)%"
          else
            echo "❌ Knowledge Store not found"
            exit 1
          fi
