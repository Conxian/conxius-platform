name: Lifecycle Control Gates

permissions:
  contents: read

# Lifecycle control gates per Issue #968
# Validates governance and lifecycle controls
# See: .github/CONXIUS_CICD_BASELINE.md

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main, develop, dev, 'release/**' ]
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main, develop, dev, 'release/**' ]
  workflow_dispatch:

jobs:
  lifecycle-control-gates:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run lifecycle/control gates
        run: |
          bash scripts/ci/run-lifecycle-control-gates.sh

      - name: Upload lifecycle/control gate artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7
        with:
          name: lifecycle-control-gates
          path: test-results/lifecycle-control-gates/
          if-no-files-found: warn
