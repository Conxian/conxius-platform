name: BOS production boundary guard

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main ]
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main ]
  workflow_dispatch:

jobs:
  bos-production-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify BOS production boundary
        run: |
          python scripts/verify_bos_production_boundary.py

      - name: Verify contamination guard
        run: |
          python scripts/verify_contamination_guard.py
