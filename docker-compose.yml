services:
  # Requires `git submodule update --init --recursive` so services/lib-conxian-core is present
  gateway:
    build:
      context: ./services/lib-conxian-core/gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - JWT_SECRET=${GATEWAY_JWT_SECRET}
      - ADMIN_API_KEY=${GATEWAY_ADMIN_API_KEY}
      - DATABASE_URL=${CORE_DB_URI}
      - BITCOIN_NETWORK=${CORE_BITCOIN_NETWORK}
    networks:
      - conxian-network
    depends_on:
      - db
      - redis

  admin-dashboard:
    build:
      context: ./services/admin-dashboard
    ports:
      - "3002:3001"
    environment:
      - NEXT_PUBLIC_CORE_API_URL=${NEXT_PUBLIC_CORE_API_URL}
    networks:
      - conxian-network

  conxian-ui:
    build:
      context: ./services/conxian-ui
    ports:
      - "${UI_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_CORE_API_URL=${NEXT_PUBLIC_CORE_API_URL}
    networks:
      - conxian-network

  # Sovereign Nodes (Placeholders - Disabled due to missing images)
  # bisq-node:
  #   image: bisq/bisq-node:latest
  #   networks:
  #     - conxian-network

  # rgb-node:
  #   image: lncm/rgb-node:latest
  #   networks:
  #     - conxian-network

  # bitvm-node:
  #   image: conxian/bitvm-node:latest
  #   networks:
  #     - conxian-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - conxian-network

  redis:
    image: redis:7-alpine
    networks:
      - conxian-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - conxian-network
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - conxian-network
    depends_on:
      - prometheus

networks:
  conxian-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
