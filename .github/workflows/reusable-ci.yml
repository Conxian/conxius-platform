name: Reusable CI Baseline

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '22'
      run-lint:
        required: false
        type: boolean
        default: true
      run-tests:
        required: false
        type: boolean
        default: true
      run-typecheck:
        required: false
        type: boolean
        default: true
      run-build:
        required: false
        type: boolean
        default: false
      run-e2e:
        required: false
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Lint
        if: ${{ inputs.run-lint }}
        run: pnpm run lint || echo "No lint script found"

      - name: Run Typecheck
        if: ${{ inputs.run-typecheck }}
        run: pnpm run typecheck || echo "No typecheck script found"

      - name: Run Tests
        if: ${{ inputs.run-tests }}
        run: pnpm test || echo "No test script found"

      - name: Run Build
        if: ${{ inputs.run-build }}
        run: pnpm run build || echo "No build script found"

      - name: Run E2E Tests
        if: ${{ inputs.run-e2e }}
        run: pnpm run test:e2e || echo "No e2e test script found"
