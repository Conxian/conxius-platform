name: Lifecycle Control Gates

permissions:
  contents: read

# Lifecycle control gates per Issue #968
# Validates governance and lifecycle controls
# See: .github/CONXIUS_CICD_BASELINE.md

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main, develop, dev, 'release/**' ]
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main, develop, dev, 'release/**' ]
  workflow_dispatch:

jobs:
  lifecycle-control-gates:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Run lifecycle/control gates
        run: |
          bash scripts/ci/run-lifecycle-control-gates.sh

      - name: Upload lifecycle/control gate artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # actions/upload-artifact@v7
        with:
          name: lifecycle-control-gates
          path: test-results/lifecycle-control-gates/
          if-no-files-found: warn
