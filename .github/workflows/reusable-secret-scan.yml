name: Reusable Secret Scan

on:
  workflow_call:

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Minimal permissions per .github/CONXIUS_CICD_BASELINE.md
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          VERSION="8.18.2"
          EXPECTED_SHA256="6298c9235dfc9278c14b28afd9b7fa4e6f4a289cb1974bd27949fc1e9122bdee"
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${EXPECTED_SHA256}  gitleaks_${VERSION}_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz"
          sudo mv gitleaks /usr/local/bin/
      - name: Run Gitleaks
        run: gitleaks detect --source . -v --redact --no-banner --config gitleaks.toml
