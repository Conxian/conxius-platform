name: Repository Hygiene Guard

permissions:
  contents: read

# Hygiene audit per Issue #968 - CI/CD Baseline Hardening
# See: .github/CONXIUS_CICD_BASELINE.md

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main, develop, dev, 'release/**' ]
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main, develop, dev, 'release/**' ]
  workflow_dispatch:

jobs:
  hygiene-audit:
    name: Security & Hygiene Audit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.10'

      - name: Run Hygiene Audit
        run: |
          # We only run the security part of the audit for this general hygiene check
          # to avoid failing on implementation drift which is handled by hygiene-drift-guard.yml
          python3 -c "
          import sys
          sys.path.append('scripts/maintenance')
          from system_audit import audit_security
          if not audit_security():
              sys.exit(1)
          "

      - name: Report Failure
        if: failure()
        run: |
          echo "::error::Hygiene violation detected! Tracked sensitive files or generated artifacts found in version control."
