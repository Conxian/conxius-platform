name: End-to-End Synergy Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *' # Run nightly

jobs:
  synergy-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up Environment Variables
      run: cp .env.schema .env

    - name: Start Full System Stack
      run: |
        docker-compose up -d --build
        echo "Waiting for services to initialize..."
        sleep 30

    - name: Run Gateway Health Check
      run: |
        curl -f http://localhost:8080/health || exit 1

    - name: Run Nexus Diagnostics
      run: |
        curl -f http://localhost:3000/v1/metrics || exit 1

    - name: Run Benchmark Script
      run: bash scripts/run-benchmarks.sh

    - name: Tear Down Stack
      if: always()
      run: docker-compose down -v
