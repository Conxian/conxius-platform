name: End-to-End Synergy Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *' # Run nightly

jobs:
  synergy-test:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Environment Variables
      run: cp .env.schema .env

    - name: Start Full System Stack
      run: |
        docker compose up -d --build
        echo "Waiting for services to initialize..."
        sleep 30

    - name: Run Gateway Health Check
      run: |
        curl -f http://localhost:8080/api/v1/health

    - name: Run Nexus Diagnostics
      run: |
        curl -f http://localhost:8080/api/v1/metrics

    - name: Run Benchmark Script
      run: bash scripts/run-benchmarks.sh

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: |
          test-results
          playwright-report
          blob-report
          coverage
        if-no-files-found: ignore
        retention-days: 14

    - name: Tear Down Stack
      if: always()
      run: docker compose down -v
