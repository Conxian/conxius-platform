name: Tagged Release

'on':
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release from tag
    runs-on: ubuntu-latest

    steps:
      - name: Validate SemVer tag format
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is not valid SemVer tag format (expected vX.Y.Z)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard release tags to commits in main
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$TAG_SHA" "origin/main"; then
            echo "Tagged commit '$TAG_SHA' is not contained in origin/main."
            echo "Release tags must point to commits already merged into main."
            exit 1
          fi

      - name: Validate production environment template
        run: ./scripts/validate-production-env.sh .env.production.schema

      - name: Verify matching changelog section exists
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version_no_prefix="${VERSION#v}"
          if ! grep -Eq "^## \[${version_no_prefix}\]( - [0-9]{4}-[0-9]{2}-[0-9]{2})?$" CHANGELOG.md; then
            echo "CHANGELOG.md is missing section for version [${version_no_prefix}]"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
