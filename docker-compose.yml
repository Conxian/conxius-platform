services:
  # Conxian Gateway - Orchestrated as an external dependency in Phase 7
  gateway:
    image: ${GATEWAY_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - JWT_SECRET=${GATEWAY_JWT_SECRET}
      - ADMIN_API_KEY=${GATEWAY_ADMIN_API_KEY}
      - DATABASE_URL=${CORE_DB_URI}
      - BITCOIN_NETWORK=${CORE_BITCOIN_NETWORK}
    networks:
      - conxian-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Admin Dashboard - Managed locally in this monorepo
  admin-dashboard:
    build:
      context: .
      dockerfile: services/admin-dashboard/Dockerfile
    restart: unless-stopped
    # The file-backed M2M registry has one writer; non-Compose orchestrators must enforce the same constraint.
    deploy:
      replicas: 1
    ports:
      - "3002:3001"
    environment:
      - GATEWAY_URL=${GATEWAY_URL}
      - CORE_API_URL=${CORE_API_URL}
      - GATEWAY_URL=${GATEWAY_URL}
      - CORE_API_URL=${CORE_API_URL}
      - NEXT_PUBLIC_CORE_API_URL=${NEXT_PUBLIC_CORE_API_URL}
      - ORACLE_ENDPOINT_URL=${ORACLE_ENDPOINT_URL}
      - STACKS_NODE_RPC_URL=${STACKS_NODE_RPC_URL}
      - TABLELAND_BASE_URL=${TABLELAND_BASE_URL}
      - KWIL_PROVIDER_URL=${KWIL_PROVIDER_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - UPSTASH_KV_KV_REST_API_URL=${UPSTASH_KV_KV_REST_API_URL}
      - UPSTREAM_REQUEST_TIMEOUT_MS=${UPSTREAM_REQUEST_TIMEOUT_MS:-5000}
      - ADMIN_DASHBOARD_API_KEY=${ADMIN_DASHBOARD_API_KEY}
      - SERVICE_KEY_GATEWAY=${SERVICE_KEY_GATEWAY}
      - SERVICE_KEY_ELIZAOS=${SERVICE_KEY_ELIZAOS}
      - SERVICE_KEY_NEXUS=${SERVICE_KEY_NEXUS}
      - SERVICE_KEY_ORBIT=${SERVICE_KEY_ORBIT}
      - SERVICE_KEY_WALLET=${SERVICE_KEY_WALLET}
      - SERVICE_KEY_UI=${SERVICE_KEY_UI}
      - SERVICE_KEY_ADMIN_DASHBOARD=${SERVICE_KEY_ADMIN_DASHBOARD}
      - SERVICE_KEY_PULSE_BOS=${SERVICE_KEY_PULSE_BOS}
      - M2M_SERVICE_KEY_REGISTRY_PATH=/var/lib/conxian/m2m/service-key-registry.json
      - PROMETHEUS_SCRAPE_PASSWORD_FILE=/run/secrets/prometheus_scrape_password
    volumes:
      - m2m_registry_data:/var/lib/conxian/m2m
    secrets:
      - prometheus_scrape_password
    networks:
      - conxian-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Conxian UI - Orchestrated as an external dependency in Phase 7
  conxian-ui:
    image: ${UI_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    ports:
      - "${UI_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_CORE_API_URL=${NEXT_PUBLIC_CORE_API_URL}
    networks:
      - conxian-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bisq-node:
    profiles:
      - bisq
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      - RPC_STUB_PACK=bisq
      - RPC_STUB_PORT=${BISQ_RPC_PORT:-9999}
    volumes:
      - ./docker/addons/rpc-stub.conf.template:/etc/nginx/templates/default.conf.template:ro
    expose:
      - "${BISQ_RPC_PORT:-9999}"
    networks:
      - conxian-network

  rgb-node:
    profiles:
      - rgb
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      - RPC_STUB_PACK=rgb
      - RPC_STUB_PORT=${RGB_RPC_PORT:-9999}
    volumes:
      - ./docker/addons/rpc-stub.conf.template:/etc/nginx/templates/default.conf.template:ro
    expose:
      - "${RGB_RPC_PORT:-9999}"
    networks:
      - conxian-network

  bitvm-node:
    profiles:
      - bitvm
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      - RPC_STUB_PACK=bitvm
      - RPC_STUB_PORT=${BITVM_RPC_PORT:-9999}
    volumes:
      - ./docker/addons/rpc-stub.conf.template:/etc/nginx/templates/default.conf.template:ro
    expose:
      - "${BITVM_RPC_PORT:-9999}"
    networks:
      - conxian-network

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - conxian-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - conxian-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - prometheus_scrape_password
    networks:
      - conxian-network
    depends_on:
      - admin-dashboard
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set to a non-default secret}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - conxian-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  conxian-network:
    driver: bridge

volumes:
  postgres_data:
  m2m_registry_data:
  prometheus_data:
  grafana_data:

secrets:
  prometheus_scrape_password:
    file: ${PROMETHEUS_SCRAPE_PASSWORD_FILE:-.secrets/prometheus-scrape.password}
