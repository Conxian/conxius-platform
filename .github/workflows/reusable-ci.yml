name: Reusable CI Baseline

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '22'
      run-lint:
        required: false
        type: boolean
        default: true
      run-tests:
        required: false
        type: boolean
        default: true
      run-typecheck:
        required: false
        type: boolean
        default: true
      run-build:
        required: false
        type: boolean
        default: false
      run-e2e:
        required: false
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Validate dependency consistency
        run: pnpm run check:dependency-consistency

      - name: Validate service catalog lifecycle
        run: pnpm run check:service-catalog

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Agent Discovery Tests
        run: pnpm run test:agent-discovery

      - name: Typecheck Agent Discovery
        run: pnpm run typecheck:agent-discovery

      - name: Run Agent Coordination Tests
        run: pnpm run test:agent-coordination

      - name: Typecheck Agent Coordination
        run: pnpm run typecheck:agent-coordination

      - name: Run Protocol Revenue Observation Tests
        run: pnpm run test:protocol-revenue-observation

      - name: Typecheck Protocol Revenue Observation
        run: pnpm run typecheck:protocol-revenue-observation

      - name: Run Lint
        if: ${{ inputs.run-lint }}
        run: |
          if jq -e '.scripts.lint' package.json > /dev/null 2>&1; then pnpm run lint; else echo "Skipping lint (no script)"; fi

      - name: Run Typecheck
        if: ${{ inputs.run-typecheck }}
        run: |
          if jq -e '.scripts.typecheck' package.json > /dev/null 2>&1; then pnpm run typecheck; else echo "Skipping typecheck (no script)"; fi

      - name: Run Tests
        if: ${{ inputs.run-tests }}
        run: |
          if jq -e '.scripts.test' package.json > /dev/null 2>&1; then pnpm test; else echo "Skipping test (no script)"; fi

      - name: Run Build
        if: ${{ inputs.run-build }}
        run: |
          if jq -e '.scripts.build' package.json > /dev/null 2>&1; then pnpm run build; else echo "Skipping build (no script)"; fi

      - name: Run E2E Tests
        if: ${{ inputs.run-e2e }}
        run: |
          if jq -e '.scripts.test:e2e' package.json > /dev/null 2>&1; then pnpm run test:e2e; else echo "Skipping e2e (no script)"; fi
