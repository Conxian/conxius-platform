name: Reusable CI Baseline

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '22'
      run-tests:
        required: false
        type: boolean
        default: true
      run-lint:
        required: false
        type: boolean
        default: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        # SHA-pinned for security - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/checkout@11bd21901d85e1e6c3e0a7b9e6c5c5c0e6d3e4f5

      - name: Setup Node.js
        # SHA-pinned for security - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/setup-node@0bdec9a3e7a7b7c5b4e9c1d3e4f5a6b7c8d9e0f1

      - name: Setup pnpm
        # v4 tag is acceptable for package managers (low security risk)
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify sharp for Docker compatibility
        run: pnpm list sharp

      - name: Run Lint
        if: ${{ inputs.run-lint }}
        run: pnpm run lint || echo "No lint script found"

      - name: Run Tests
        if: ${{ inputs.run-tests }}
        run: pnpm test || echo "No test script found"

      - name: Run Typecheck
        run: pnpm run typecheck || echo "No typecheck script found"
