name: Reusable Hygiene Audit

# Reusable hygiene audit per Issue #968 - CI/CD Baseline Hardening
# See: .github/CONXIUS_CICD_BASELINE.md

on:
  workflow_call:

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Minimal permissions per .github/CONXIUS_CICD_BASELINE.md
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/checkout@v7
      - name: Set up Python
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Run Hygiene Audit
        run: |
          if [ ! -f scripts/maintenance/system_audit.py ]; then
            echo "::error::system_audit.py not found — hygiene audit cannot run. Add scripts/maintenance/system_audit.py to your repository."
            exit 1
          else
            python3 -c "
          import sys
          sys.path.append('scripts/maintenance')
          from system_audit import audit_security
          if not audit_security():
              sys.exit(1)
          "
          fi
