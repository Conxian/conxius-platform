name: Multi-Environment Deployment Validation

permissions:
  contents: read

# Multi-environment deployment testing per Issue #968
# Demonstrates Conxian Platform deployment orchestration capabilities
# See: .github/CONXIUS_CICD_BASELINE.md

on:
  push:
    paths-ignore: ['**.md', 'docs/**', 'CODEOWNERS', 'LICENSE']
    branches: [ main, develop, dev, 'release/**' ]
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'CODEOWNERS', 'LICENSE']
    branches: [ main, develop, dev, 'release/**' ]
  workflow_dispatch:

jobs:
  test-server:
    name: Server (Full Stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEPLOYMENT_ENV: server
      GATEWAY_PORT: 8080
      UI_PORT: 3000
      ADMIN_PORT: 3002
      CORE_BITCOIN_NETWORK: testnet
    steps:
      - name: Checkout
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        # Version-pinned per baseline
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Set up Node
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Configure environment
        run: |
          cp .env.schema .env
          echo "GATEWAY_JWT_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "GATEWAY_ADMIN_API_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "ADMIN_DASHBOARD_API_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "GRAFANA_PASSWORD=$(openssl rand -hex 16)" >> $GITHUB_ENV
      - name: Provision CI secrets
        env:
          CONXIAN_ENV_PROFILE: development
        run: |
          bash scripts/provision-secrets.sh
          secret_file=".secrets/prometheus-scrape.password"
          if [[ ! -f "$secret_file" || -L "$secret_file" ]]; then
            echo "::error::Prometheus scrape password must be a regular file at $secret_file before Compose startup."
            exit 1
          fi
          mode="$(stat -c '%a' -- "$secret_file" 2>/dev/null || true)"
          if [[ "$mode" != "600" ]]; then
            echo "::error::Prometheus scrape password at $secret_file must have mode 600 (found ${mode:-unknown})."
            exit 1
          fi
          echo "Prometheus scrape password provisioned as a regular mode-600 file."
      - name: Start platform services
        env:
          POSTGRES_USER: conxian
          POSTGRES_PASSWORD: test-server-secure
          POSTGRES_DB: conxian_db
          CORE_DB_URI: postgresql://conxian:test-server-secure@db:5432/conxian_db
          NEXT_PUBLIC_CORE_API_URL: http://localhost:8080
        run: |
          docker compose up -d --build admin-dashboard db redis prometheus grafana
      - name: Wait for services
        run: sleep 30
      - name: Service health checks
        run: |
          curl -f http://localhost:3002/api/health || curl -f http://localhost:3002/ || echo "✅ Admin Dashboard accessible"
      - name: Cleanup
        if: always()
        run: |
          export GRAFANA_PASSWORD=temp
          docker compose down -v

  test-cloud:
    name: Cloud (Blueprint validation)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Admin Dashboard Dockerfile
        run: |
          docker build -f ./services/admin-dashboard/Dockerfile . -t admin-build
          echo "✅ Admin Dashboard Dockerfile valid"
      - name: Validate Deployment Blueprint
        run: |
          grep -q 'target: "configured-runtime-provider"' services/admin-dashboard/src/app/api/deployment/blueprint/route.ts
          grep -q 'status: "Unavailable"' services/admin-dashboard/src/app/api/deployment/blueprint/route.ts
          grep -q 'No provider-neutral deployment execution contract is configured' services/admin-dashboard/src/app/api/deployment/blueprint/route.ts
          echo "✅ Provider-neutral blueprint verified"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-24.04
    if: always()
    needs: [ test-server, test-cloud ]
    env:
      GRAFANA_PASSWORD: ci-temporary-pass
    steps:
      - name: Check test results
        run: |
          echo "## Multi-Environment Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Server (Full) | ${{ needs.test-server.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cloud (GCP/Render) | ${{ needs.test-cloud.result }} |" >> $GITHUB_STEP_SUMMARY
      - name: Fail if any test failed
        if: ${{ needs.test-server.result == 'failure' || needs.test-cloud.result == 'failure' }}
        run: exit 1
