name: Dependency Review

# Dependency review per Issue #968 - CI/CD Baseline Hardening
# See: .github/CONXIUS_CICD_BASELINE.md

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/checkout@v4
      - name: Dependency Review
        # Version-pinned per baseline
        uses: actions/dependency-review-action@v5
