name: CI Baseline

# CI/CD Baseline per Issue #968
# See: .github/CONXIUS_CICD_BASELINE.md

on:
  pull_request:
    branches: [ main, develop, dev, 'release/**' ]
  push:
    branches: [ main, develop, dev, 'release/**' ]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    permissions:
      contents: read
