name: Dependency Review

# Dependency review per Issue #968 - CI/CD Baseline Hardening
# See: .github/CONXIUS_CICD_BASELINE.md

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency Review
        # Version-pinned per baseline
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
