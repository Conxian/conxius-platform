version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/services/admin-dashboard"
      - "/services/admin-pulse-bos"
      - "/services/elizaos-plugin-conxian"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        patterns:
          - "@playwright/*"
          - "playwright"
          - "vite"
          - "typescript"
          - "@types/*"
        update-types: ["minor", "patch"]
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@playwright/*"
          - "playwright"
          - "vite"
          - "typescript"
          - "@types/*"
        update-types: ["minor", "patch"]
  - package-ecosystem: "cargo"
    directory: "/services/lib-conxian-core"
    schedule:
      interval: "weekly"
    groups:
      rust-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/services/lib-conxian-core/gateway"
    schedule:
      interval: "weekly"
    groups:
      gateway-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
