name: Lifecycle Control Gates

# Lifecycle control gates per Issue #968
# Validates governance and lifecycle controls
# See: .github/CONXIUS_CICD_BASELINE.md

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main, develop ]
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lifecycle-control-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # SHA-pinned for security - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/checkout@11bd21901d85e1e6c3e0a7b9e6c5c5c0e6d3e4f5

      - name: Set up Python
        # SHA-pinned for security - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/setup-python@0bdec9a3e7a7b7c5b4e9c1d3e4f5a6b7c8d9e0f1
        with:
          python-version: "3.11"

      - name: Run lifecycle/control gates
        run: |
          bash scripts/ci/run-lifecycle-control-gates.sh

      - name: Upload lifecycle/control gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-control-gates
          path: test-results/lifecycle-control-gates/
          if-no-files-found: warn
