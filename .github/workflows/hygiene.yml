name: Repository Hygiene Guard

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main, develop ]
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  hygiene-audit:
    uses: ./.github/workflows/reusable-hygiene.yml
    permissions:
      contents: read
