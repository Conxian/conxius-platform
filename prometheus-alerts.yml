groups:
  - name: sidl-admin-dashboard-alerts
    rules:
      - alert: SIDLAdminDashboardFailureBurst
        expr: sum by (endpoint, method) (increase(admin_dashboard_sidl_failures_total[10m])) >= 5
        for: 10m
        labels:
          severity: warning
          service: admin-dashboard
          component: sidl
        annotations:
          summary: "SIDL endpoint failures are spiking"
          description: "{{ $labels.endpoint }} {{ $labels.method }} has {{ $value }} failures in the last 10 minutes."

      - alert: SIDLAdminDashboardLatencyP95High
        expr: histogram_quantile(0.95, sum by (le, endpoint, method) (rate(admin_dashboard_sidl_request_duration_seconds_bucket[10m]))) > 1
        for: 15m
        labels:
          severity: warning
          service: admin-dashboard
          component: sidl
        annotations:
          summary: "SIDL endpoint p95 latency is elevated"
          description: "{{ $labels.endpoint }} {{ $labels.method }} p95 latency is {{ $value }}s over the last 10 minutes."

      - alert: SIDLCheckoutInvalidPaymentHeaderSpike
        expr: sum(increase(admin_dashboard_sidl_checkout_payment_header_total{category="invalid"}[10m])) >= 3
        for: 10m
        labels:
          severity: critical
          service: admin-dashboard
          component: sidl-checkout
        annotations:
          summary: "Invalid SIDL checkout payment signatures increased"
          description: "Invalid payment-signature headers reached {{ $value }} in the last 10 minutes."

  - name: infrastructure-alerts
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          component: node
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
          component: node
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value }}% on {{ $labels.instance }}."

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: critical
          component: node
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk space is at {{ $value }}% on {{ $labels.instance }}."

      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL instance {{ $labels.instance }} is not reachable."

      - alert: PostgreSQLTooManyConnections
        expr: pg_stat_database_numbackends > pg_settings_max_connections * 0.8
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL connection count is high"
          description: "{{ $value }} connections on {{ $labels.instance }} (80% of max)."

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          component: cache
        annotations:
          summary: "Redis is down"
          description: "Redis instance {{ $labels.instance }} is not reachable."

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis memory at {{ $value | humanizePercentage }} on {{ $labels.instance }}."

      - alert: GatewayHighErrorRate
        expr: rate(gateway_http_errors_total[5m]) / rate(gateway_http_requests_total[5m]) > 0.05
        for: 10m
        labels:
          severity: critical
          component: gateway
        annotations:
          summary: "Gateway error rate is elevated"
          description: "Gateway error rate is {{ $value | humanizePercentage }} over 5m."

      - alert: GatewayHighLatency
        expr: histogram_quantile(0.95, rate(gateway_http_request_duration_seconds_bucket[5m])) > 2
        for: 10m
        labels:
          severity: warning
          component: gateway
        annotations:
          summary: "Gateway p95 latency is high"
          description: "Gateway p95 latency is {{ $value }}s."

      - alert: PrometheusTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
          component: monitoring
        annotations:
          summary: "Prometheus target {{ $labels.job }} is down"
          description: "Target {{ $labels.instance }} of job {{ $labels.job }} has been down for 5m."
