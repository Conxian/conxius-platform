name: Reusable Hygiene Audit

# Reusable hygiene audit per Issue #968 - CI/CD Baseline Hardening
# See: .github/CONXIUS_CICD_BASELINE.md

on:
  workflow_call:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Minimal permissions per .github/CONXIUS_CICD_BASELINE.md
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        # SHA-pinned for security - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/checkout@11bd21901d85e1e6c3e0a7b9e6c5c5c0e6d3e4f5
      - name: Set up Python
        # SHA-pinned for security - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/setup-python@0bdec9a3e7a7b7c5b4e9c1d3e4f5a6b7c8d9e0f1
        with:
          python-version: '3.10'
      - name: Run Hygiene Audit
        run: |
          if [ ! -f scripts/maintenance/system_audit.py ]; then
            echo "Warning: system_audit.py not found in local path."
          else
            python3 -c "
          import sys
          sys.path.append('scripts/maintenance')
          from system_audit import audit_security
          if not audit_security():
              sys.exit(1)
          "
          fi
