name: Reusable Rust CI Baseline

on:
  workflow_call:
    inputs:
      toolchain:
        required: false
        type: string
        default: 'stable'
      run-fmt:
        required: false
        type: boolean
        default: true
      run-clippy:
        required: false
        type: boolean
        default: true
      run-test:
        required: false
        type: boolean
        default: true
      run-audit:
        required: false
        type: boolean
        default: true
      working-directory:
        required: false
        type: string
        default: '.'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run fmt
        if: ${{ inputs.run-fmt }}
        run: cargo fmt --all -- --check

      - name: Run clippy
        if: ${{ inputs.run-clippy }}
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        if: ${{ inputs.run-test }}
        run: cargo test --all-features

      - name: Install cargo-audit
        if: ${{ inputs.run-audit }}
        run: cargo install cargo-audit --locked

      - name: Run security audit
        if: ${{ inputs.run-audit }}
        run: cargo audit
