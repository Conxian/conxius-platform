name: BOS production boundary guard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  bos-production-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify BOS production boundary
        run: |
          python scripts/verify_bos_production_boundary.py

      - name: Verify submodule integrity
        run: |
          python scripts/verify_submodule_integrity.py

      - name: Verify contamination guard
        run: |
          python scripts/verify_contamination_guard.py
