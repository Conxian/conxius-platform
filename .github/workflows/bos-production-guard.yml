name: BOS production boundary guard

# BOS production boundary guard per Issue #968
# Validates control-plane ownership boundaries
# See: .github/CONXIUS_CICD_BASELINE.md

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main ]
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main ]
  workflow_dispatch:

jobs:
  bos-production-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # SHA-pinned for security - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/checkout@11bd21901d85e1e6c3e0a7b9e6c5c5c0e6d3e4f5

      - name: Set up Python
        # SHA-pinned for security - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/setup-python@0bdec9a3e7a7b7c5b4e9c1d3e4f5a6b7c8d9e0f1
        with:
          python-version: "3.11"

      - name: Verify BOS production boundary
        run: |
          python scripts/verify_bos_production_boundary.py

      - name: Verify contamination guard
        run: |
          python scripts/verify_contamination_guard.py
