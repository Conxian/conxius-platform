name: Cross-Repo Integration Harness MVP

permissions:
  contents: read

# Cross-repo integration testing per Issue #968
# Validates control-plane cross-service orchestration
# See: .github/CONXIUS_CICD_BASELINE.md

on:
  push:
    paths-ignore: ['**.md', 'docs/**', 'CODEOWNERS', 'LICENSE']
    branches: [ main, dev, 'release/**' ]
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'CODEOWNERS', 'LICENSE']
    branches: [ main, dev, 'release/**' ]
  workflow_dispatch:

jobs:
  cross-repo-integration-harness-mvp:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      POSTGRES_USER: conxian
      POSTGRES_PASSWORD: test-only-insecure
      POSTGRES_DB: conxian_db
      CORE_DB_URI: postgresql://conxian:test-only-insecure@db:5432/conxian_db
      GATEWAY_JWT_SECRET: ci-gateway-jwt-secret
      GATEWAY_ADMIN_API_KEY: ci-gateway-admin-api-key
      ADMIN_DASHBOARD_API_KEY: ci-admin-dashboard-api-key
      NEXT_PUBLIC_CORE_API_URL: http://127.0.0.1:8080
      GRAFANA_PASSWORD: ci-grafana-password
    steps:
      - name: Checkout repository
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Install workspace dependencies
        run: |
          pnpm run check:dependency-consistency
          pnpm install --frozen-lockfile
      - name: Bring up compose dependencies
        run: docker compose up -d db redis
      - name: Run cross-repo harness checks (Platform only)
        run: |
          pnpm --dir services/admin-dashboard test
          pnpm --dir services/elizaos-plugin-conxian test
      - name: Collect compose logs
        if: always()
        run: |
          mkdir -p test-results/cross-repo-harness-mvp
          docker compose logs db > test-results/cross-repo-harness-mvp/docker-db.log || true
          docker compose logs redis > test-results/cross-repo-harness-mvp/docker-redis.log || true
      - name: Upload harness artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-repo-integration-harness-mvp-artifacts
          path: test-results/cross-repo-harness-mvp
          if-no-files-found: warn
          retention-days: 14
      - name: Tear down compose services
        if: always()
        run: docker compose down -v
