name: Implementation Drift Guard

# Implementation drift guard per Issue #968
# Validates repository hygiene alignment
# See: .github/CONXIUS_CICD_BASELINE.md

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main, develop ]
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CODEOWNERS'
      - 'LICENSE'
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  drift-check:
    name: Implementation Alignment Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/checkout@v7

      - name: Set up Python
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Run Drift Check
        run: |
          python3 scripts/verify_multidimensional_alignment.py

      - name: Report Failure
        if: failure()
        run: |
          echo "::error::Implementation drift detected! Service alignment verification failed."
