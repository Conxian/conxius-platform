version: 2
updates:
  - package-ecosystem: "pnpm"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pnpm"
    directory: "/services/admin-dashboard"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pnpm"
    directory: "/services/conxian-ui"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pnpm"
    directory: "/services/elizaos-plugin-conxian"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/services/lib-conxian-core"
    schedule:
      interval: "weekly"
    groups:
      rust-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/services/lib-conxian-core/gateway"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
