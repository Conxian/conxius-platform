name: Reusable Dependency Review

on:
  workflow_call:

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Minimal permissions per .github/CONXIUS_CICD_BASELINE.md
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        # Version-pinned per baseline - see .github/CONXIUS_CICD_BASELINE.md
        uses: actions/checkout@v7
      - name: Dependency Review
        # Version-pinned per baseline
        uses: actions/dependency-review-action@v5.0.0
