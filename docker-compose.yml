services:
  # Conxian Gateway - Orchestrated as an external dependency in Phase 7
  gateway:
    image: ${GATEWAY_IMAGE:-nginx:alpine} # Default to stub if image not provided
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - JWT_SECRET=${GATEWAY_JWT_SECRET}
      - ADMIN_API_KEY=${GATEWAY_ADMIN_API_KEY}
      - DATABASE_URL=${CORE_DB_URI}
      - BITCOIN_NETWORK=${CORE_BITCOIN_NETWORK}
    networks:
      - conxian-network
    depends_on:
      - db
      - redis

  # Admin Dashboard - Managed locally in this monorepo
  admin-dashboard:
    build:
      context: ./services/admin-dashboard
    ports:
      - "3002:3001"
    environment:
      - NEXT_PUBLIC_CORE_API_URL=${NEXT_PUBLIC_CORE_API_URL}
      - ADMIN_DASHBOARD_API_KEY=${ADMIN_DASHBOARD_API_KEY}
    networks:
      - conxian-network

  # Conxian UI - Orchestrated as an external dependency in Phase 7
  conxian-ui:
    image: ${UI_IMAGE:-nginx:alpine} # Default to stub if image not provided
    ports:
      - "${UI_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_CORE_API_URL=${NEXT_PUBLIC_CORE_API_URL}
    networks:
      - conxian-network

  bisq-node:
    profiles:
      - bisq
    image: nginx:1.27-alpine
    environment:
      - RPC_STUB_PACK=bisq
      - RPC_STUB_PORT=${BISQ_RPC_PORT:-9999}
    volumes:
      - ./docker/addons/rpc-stub.conf.template:/etc/nginx/templates/default.conf.template:ro
    expose:
      - "${BISQ_RPC_PORT:-9999}"
    networks:
      - conxian-network

  rgb-node:
    profiles:
      - rgb
    image: nginx:1.27-alpine
    environment:
      - RPC_STUB_PACK=rgb
      - RPC_STUB_PORT=${RGB_RPC_PORT:-9999}
    volumes:
      - ./docker/addons/rpc-stub.conf.template:/etc/nginx/templates/default.conf.template:ro
    expose:
      - "${RGB_RPC_PORT:-9999}"
    networks:
      - conxian-network

  bitvm-node:
    profiles:
      - bitvm
    image: nginx:1.27-alpine
    environment:
      - RPC_STUB_PACK=bitvm
      - RPC_STUB_PORT=${BITVM_RPC_PORT:-9999}
    volumes:
      - ./docker/addons/rpc-stub.conf.template:/etc/nginx/templates/default.conf.template:ro
    expose:
      - "${BITVM_RPC_PORT:-9999}"
    networks:
      - conxian-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - conxian-network

  redis:
    image: redis:7-alpine
    networks:
      - conxian-network

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - conxian-network
    depends_on:
      - admin-dashboard

  grafana:
    image: grafana/grafana:11.2.2
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set to a non-default secret}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - conxian-network
    depends_on:
      - prometheus

networks:
  conxian-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
