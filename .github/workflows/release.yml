name: Tagged Release

# Release workflow per Issue #968 - CI/CD Baseline Hardening
# See: .github/CONXIUS_CICD_BASELINE.md

'on':
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  actions: read
  id-token: write
  packages: read
  attestations: write

jobs:
  release:
    name: Create GitHub Release from tag
    runs-on: ubuntu-24.04

    steps:
      - name: Validate SemVer tag format
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is not valid SemVer tag format (expected vX.Y.Z)."
            false
          fi

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Guard release tags to commits in main
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$TAG_SHA" "origin/main"; then
            echo "Tagged commit '$TAG_SHA' is not contained in origin/main."
            echo "Release tags must point to commits already merged into main."
            false
          fi

      - name: Validate production environment template
        run: ./scripts/validate-production-env.sh .env.production.schema

      - name: Verify matching changelog section exists
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version_no_prefix="${VERSION#v}"
          if ! grep -Eq "^## \[${version_no_prefix}\]( - [0-9]{4}-[0-9]{2}-[0-9]{2})?$" CHANGELOG.md; then
            echo "CHANGELOG.md is missing section for version [${version_no_prefix}]"
            false
          fi

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          path: ./
          format: cyclonedx-json
          output-file: "sbom-${{ github.ref_name }}.cdx.json"

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-path: "sbom-${{ github.ref_name }}.cdx.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: "sbom-${{ github.ref_name }}.cdx.json"
