name: Action Version Audit

on:
  pull_request:
    branches: [main, dev, 'release/**']
    paths:
      - '.github/workflows/**'
  push:
    branches: [main, dev, 'release/**']
    paths:
      - '.github/workflows/**'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Validate action version tags
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Validate action versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_action_versions.py
